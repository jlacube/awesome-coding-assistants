# Handoff Schema: Planner -> Coder
#
# Maintenance (FR-006): When the Planner or Coder interface changes,
# update this schema and commit it together with the agent changes.
# Version changes (FR-007): Increment to handoff/v2 for incompatible changes.

schema: handoff/v1
source_agent: "3. Planner"
target_agent: "4. Coder"
description: "Handoff from Planner to Coder with work package for implementation"

required_artifacts:
  - path: ".sdd/plans/WP{NN}-{slug}.md"
    validation:
      - exists: true
      - field: "lane"
        value: "planned"

  - path: ".sdd/plans/contracts/{WP-slug}/"
    validation:
      - exists: true

required_state:
  - condition: "wp.lane == 'planned'"
    error: "WP must have lane=planned before implementation"

context_fields:
  - name: "wp_path"
    type: "string"
    required: true
    description: "Path to the work package file to implement"

  - name: "spec_path"
    type: "string"
    required: true
    description: "Path to the source spec file"

  - name: "contracts_dir"
    type: "string"
    required: true
    description: "Path to the contracts directory for this WP"

validation_rules:
  - check: "file_exists"
    target: "wp_path"
    error: "WP file does not exist at {wp_path}"

  - check: "field_value"
    target: "wp_path"
    field: "lane"
    expected: "planned"
    error: "WP lane is not 'planned'"
