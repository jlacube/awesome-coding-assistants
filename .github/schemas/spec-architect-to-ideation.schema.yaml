# Handoff Schema: Spec Architect -> Ideation
#
# Maintenance (FR-006): When the Spec Architect or Ideation interface changes,
# update this schema and commit it together with the agent changes.
# Version changes (FR-007): Increment to handoff/v2 for incompatible changes.

schema: handoff/v1
source_agent: "2. Spec Architect"
target_agent: "1. Ideation"
description: "Handoff from Spec Architect back to Ideation when the brief has fundamental issues that require revision"

required_state:
  - condition: "spec process has identified issues with the brief"
    error: "Issue list is required when returning to ideation"

context_fields:
  - name: "brief_path"
    type: "string"
    required: true
    description: "Path to the ideation brief that needs revision"

  - name: "issues"
    type: "string"
    required: true
    description: "List of fundamental issues identified during specification"

validation_rules:
  - check: "file_exists"
    target: "brief_path"
    error: "Brief file does not exist at {brief_path}"

version_history:
  - version: "handoff/v1"
    date: "2026-04-12"
    description: "Initial version"
