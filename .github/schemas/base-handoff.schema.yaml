# Shared Base Handoff Schema
#
# Defines reusable validation patterns referenced by individual handoff schemas.
# If this file is missing, individual schemas SHALL fall back to inline rules.
# Error E-024 (BASE_SCHEMA_NOT_FOUND): agents log a warning and use inline fallback.
#
# Source spec: .sdd/specs/010-sdd-pipeline-hardening.spec.md
# Spec refs: FR-049, FR-050, Section 7.4

schema: base/v1
description: "Shared validation patterns for handoff schemas. Individual schemas reference these patterns via base_schema field."

validation_patterns:
  wp_file_exists:
    check: "File at target path exists and has valid YAML frontmatter"
    error: "WP file does not exist or has invalid YAML frontmatter at {path}"

  lane_value_valid:
    check: "Field 'lane' value is one of the lane enum values"
    enum_ref: ".github/schemas/enums.yaml#lane"
    error: "Lane value '{value}' is not a valid enum value. Expected one of: planned, doing, for_review, to_do, done, blocked"

  file_path_format:
    check: "File path matches expected WP path format"
    pattern: "^\\.sdd/plans/WP\\d{2}-[a-z0-9-]+\\.md$"
    error: "File path '{path}' does not match expected format: .sdd/plans/WP<NN>-<slug>.md"

# WP frontmatter fields managed by pipeline agents (not part of handoff validation,
# but documented here as the canonical schema for pipeline-internal WP fields).
wp_frontmatter_fields:
  lane:
    type: "string"
    enum_ref: ".github/schemas/enums.yaml#lane"
    description: "Current WP lifecycle stage. Set by Coder (planned->doing->for_review) and Review Coordinator (for_review->done or for_review->to_do)."
    managed_by: ["4. Coder", "5. Review Coordinator"]

  depends_on:
    type: "array"
    items: "string"
    description: "List of WP IDs this WP depends on (e.g., ['WP01']). Empty array means no dependencies."
    managed_by: ["3. Planner"]

  target_language:
    type: "string"
    description: "Primary programming language for this WP (e.g., 'TypeScript', 'Python'). Set by Planner from spec."
    managed_by: ["3. Planner"]

  target_framework:
    type: "string"
    description: "Primary framework for this WP (e.g., 'Next.js', 'FastAPI'). Set by Planner from spec. May be empty."
    managed_by: ["3. Planner"]

  docs_scope:
    type: "array"
    items: "string"
    description: "List of doc skill short names to run for this WP (e.g., ['api-reference', 'changelog']). Empty array means all doc skills."
    managed_by: ["3. Planner"]

  coverage_code:
    type: "integer"
    minimum: 0
    maximum: 100
    description: "Required line coverage percentage. Default 80."
    managed_by: ["3. Planner"]

  coverage_branch:
    type: "integer"
    minimum: 0
    maximum: 100
    description: "Required branch coverage percentage. Default 90."
    managed_by: ["3. Planner"]

  review_status:
    type: "string"
    description: "Review verdict from last review cycle. Set by Coder when processing review feedback. Absent on fresh WPs."
    managed_by: ["4. Coder"]

  Spec:
    type: "string"
    description: "Path to the specification file this WP implements. Set in the WP markdown table, not YAML frontmatter."
    managed_by: ["3. Planner"]

  review_cycles:
    type: "integer"
    minimum: 0
    description: "Number of review cycles completed. Incremented by Review Coordinator on each review round. Read by Orchestrator for stall detection (>= 2). If absent from WP frontmatter, treat as 0."
    managed_by: ["5. Review Coordinator", "0. Orchestrator"]

  docs_completed:
    type: "boolean"
    default: false
    description: "Whether documentation has been generated for this WP. Set to true by Docs Agent after successful doc generation. Read by Orchestrator to determine if docs step is done. If absent, treat as false."
    managed_by: ["6. Docs Agent", "0. Orchestrator"]

version_history:
  - version: "base/v1"
    date: "2026-04-04"
    description: "Initial version"
