# Handoff Schema: Planner -> Orchestrator (completion signal)
#
# Maintenance (FR-006): When the Planner or Orchestrator interface changes,
# update this schema and commit it together with the agent changes.
# Version changes (FR-007): Increment to handoff/v2 for incompatible changes.
#
# Source spec: .sdd/specs/010-sdd-pipeline-hardening.spec.md
# Spec refs: FR-027, Section 7.7

schema: handoff/v1
source_agent: "3. Planner"
target_agent: "0. Orchestrator"
description: "Handoff from Planner to Orchestrator after work package decomposition completes"
base_schema: ".github/schemas/base-handoff.schema.yaml"

required_artifacts:
  - path: ".sdd/plans/README.md"
    validation:
      - exists: true
  - path: ".sdd/plans/WP{NN}-{slug}.md"
    validation:
      - exists: true
      - field: "lane"
        expected: "planned"

required_state:
  - condition: "all WPs have lane=planned"
    error: "All work packages must have lane=planned after planning"
  - condition: "README.md lists all WPs"
    error: "Plans README must list all generated work packages"

context_fields:
  - name: "spec_path"
    type: "string"
    required: true
    description: "Path to the source specification"

  - name: "wp_count"
    type: "integer"
    required: true
    description: "Total number of work packages generated"

  - name: "contracts_dir"
    type: "string"
    required: false
    description: "Path to generated contracts directory"

validation_rules:
  - check: "file_exists"
    target: "spec_path"
    error: "Spec file does not exist at {spec_path}"

  - check: "directory_exists"
    target: ".sdd/plans/"
    error: "Plans directory must exist"

placeholder_patterns:
  "{NN}": "\\d{2}"
  "{slug}": "[a-z0-9-]+"
