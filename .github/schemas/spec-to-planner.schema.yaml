# Handoff Schema: Spec Architect -> Planner
# Reference schema (FR-003 example). All other schemas follow this structure.
#
# Maintenance (FR-006): When the Spec Architect or Planner interface changes,
# update this schema and commit it together with the agent changes.
# Version changes (FR-007): Increment to handoff/v2 for incompatible changes.

schema: handoff/v1
source_agent: "2. Spec Architect"
target_agent: "3. Planner"
description: "Handoff from Spec Architect to Planner after spec validation"
base_schema: ".github/schemas/base-handoff.schema.yaml"

required_artifacts:
  - path: ".sdd/specs/{NNN}-{name}.spec.md"
    validation:
      - field: "Status"
        value: "Validated"
      - exists: true

  - path: ".sdd/specs/artifacts/{NNN}-{name}/"
    validation:
      - min_files: 1

required_state:
  - condition: "spec.status == 'Validated'"
    error: "Spec must be Validated before planning"

context_fields:
  - name: "spec_path"
    type: "string"
    required: true
    description: "Path to the validated spec file"

  - name: "artifacts_dir"
    type: "string"
    required: true
    description: "Path to companion artifacts directory"

validation_rules:
  # Uses base schema patterns: wp_file_exists, file_path_format
  # Inline rules kept as fallback if base schema is unavailable (FR-049)
  - check: "file_exists"
    target: "spec_path"
    error: "Spec file does not exist at {spec_path}"

  - check: "field_value"
    target: "spec_path"
    field: "Status"
    expected: "Validated"
    error: "Spec status is not Validated"

placeholder_patterns:
  # Regex patterns for path placeholders used in required_artifacts
  "{NNN}": "\\d{2,3}"   # 2-3 digit spec number
  "{name}": "[a-z0-9-]+"  # lowercase alphanumeric with hyphens

version_history:
  - version: "handoff/v1"
    date: "2026-04-04"
    description: "Initial version"
