# Handoff Schema: Retro-Spec -> Spec Architect
#
# When the Retro-Spec or Spec Architect interface changes,
# update this schema and commit it together with the agent changes.

schema: handoff/v1
source_agent: "7. Retro-Spec"
target_agent: "2. Spec Architect"
description: "Handoff from Retro-Spec agent to Spec Architect for spec refinement and validation"

required_artifacts:
  - path: ".sdd/retro/global-view.spec.md"
    validation:
      - exists: true
  - path: ".sdd/retro/discovery-manifest.md"
    validation:
      - exists: true

required_state:
  - condition: "retro-spec analysis complete (global-view.spec.md exists)"
    error: "Retro-spec analysis must complete before handing off to Spec Architect"

context_fields:
  - name: "spec_path"
    type: "string"
    required: true
    description: "Path to the retro-spec generated specification file"
  - name: "artifacts_dir"
    type: "string"
    required: true
    description: "Path to the retro-spec artifacts directory"
  - name: "target_language"
    type: "string"
    required: false
    description: "Target language for reimplementation"
  - name: "confidence_report"
    type: "string"
    required: false
    description: "Summary of confidence levels across the spec"

validation_rules:
  - check: "file_exists"
    target: "spec_path"
    error: "Retro-spec generated specification does not exist at {spec_path}"
  - check: "file_exists"
    target: "artifacts_dir"
    error: "Retro-spec artifacts directory does not exist at {artifacts_dir}"

version_history:
  - version: "handoff/v1"
    date: "2026-04-11"
    description: "Initial version"
