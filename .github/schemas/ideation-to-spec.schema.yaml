# Handoff Schema: Ideation -> Spec Architect
#
# Maintenance (FR-006): When the Ideation or Spec Architect interface changes,
# update this schema and commit it together with the agent changes.
# Version changes (FR-007): Increment to handoff/v2 for incompatible changes.

schema: handoff/v1
source_agent: "1. Ideation"
target_agent: "2. Spec Architect"
description: "Handoff from Ideation agent to Spec Architect with idea brief"

required_artifacts:
  - path: ".sdd/ideas/{NNN}-*.md"
    validation:
      - exists: true

required_state:
  - condition: "brief file exists at brief_path"
    error: "Idea brief does not exist at {brief_path}"

context_fields:
  - name: "brief_path"
    type: "string"
    required: true
    description: "Path to the idea brief file"

validation_rules:
  - check: "file_exists"
    target: "brief_path"
    error: "Idea brief does not exist at {brief_path}"
