# Handoff Schema: Coder -> Review Coordinator
#
# Maintenance (FR-006): When the Coder or Review Coordinator interface changes,
# update this schema and commit it together with the agent changes.
# Version changes (FR-007): Increment to handoff/v2 for incompatible changes.

schema: handoff/v1
source_agent: "4. Coder"
target_agent: "5. Review Coordinator"
description: "Handoff from Coder to Review Coordinator after implementation"
base_schema: ".github/schemas/base-handoff.schema.yaml"

required_artifacts:
  - path: ".sdd/plans/WP{NN}-{slug}.md"
    validation:
      - exists: true
      - field: "lane"
        value: "for_review"

required_state:
  - condition: "wp.lane == 'for_review'"
    error: "WP must have lane=for_review before review"
  - condition: "all tests passing"
    error: "All tests must pass before submitting for review"

context_fields:
  - name: "wp_path"
    type: "string"
    required: true
    description: "Path to the work package file with implementation"

  - name: "spec_path"
    type: "string"
    required: true
    description: "Path to the source spec file"

  - name: "contracts_dir"
    type: "string"
    required: true
    description: "Path to the contracts directory for this WP"

validation_rules:
  # Uses base schema patterns: wp_file_exists, lane_value_valid, file_path_format
  # Inline rules kept as fallback if base schema is unavailable (FR-049)
  - check: "file_exists"
    target: "wp_path"
    error: "WP file does not exist at {wp_path}"

  - check: "field_value"
    target: "wp_path"
    field: "lane"
    expected: "for_review"
    error: "WP lane is not 'for_review'"

version_history:
  - version: "handoff/v1"
    date: "2026-04-04"
    description: "Initial version"
